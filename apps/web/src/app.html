<!doctype html>
<html lang="en" class="dark" style="background-color:#0d1117;color-scheme:dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>gang.guide</title>
    <meta name="description" content="Evidence backed mapping of criminal organizations across the US — alliances, rivalries, history, and culture." />
    <link rel="canonical" href="https://gang.guide" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="gang.guide" />
    <meta property="og:description" content="Evidence backed mapping of criminal organizations across the US — alliances, rivalries, history, and culture." />
    <meta property="og:url" content="https://gang.guide" />
    <meta property="og:image" content="https://gang.guide/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="gang.guide" />
    <meta name="twitter:description" content="Evidence backed mapping of criminal organizations across the US — alliances, rivalries, history, and culture." />
    <meta name="twitter:image" content="https://gang.guide/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Font: non-blocking so a slow Google Fonts hop cannot stall first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- Theme -->
    <meta name="theme-color" content="#0d1117" />
    <meta name="darkreader-lock" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" style="background-color:#0d1117;margin:0">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
